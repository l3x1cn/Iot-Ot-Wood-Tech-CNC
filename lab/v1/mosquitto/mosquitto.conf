# A14: lokalny broker MQTT w strefie operacji (Z4) labu v1.
# W T09 jeszcze jawny 1883 i anonimowy — tak jak broker w chmurze w v0 — żeby telemetria działała,
# zanim dojdzie TLS. T10 przełącza go na 8883 z certyfikatami z własnego CA, a T11 dodaje konta i ACL
# zgodne z kanałami (maszyny piszą swoje tematy, bramka tylko czyta).
listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_dest stdout
log_type warning
log_type notice
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
