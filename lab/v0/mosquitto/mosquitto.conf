# v0: broker „w chmurze”, do którego maszyny piszą bezpośrednio.
# Jawny MQTT na 1883, logowanie anonimowe, brak ACL: każdy może czytać i publikować wszystko.
listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_dest stdout
log_type all
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
