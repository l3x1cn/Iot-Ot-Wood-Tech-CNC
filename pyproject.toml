[project]
name = "iot-ot-wood-tech-cnc"
version = "0.1.0"
description = "Cyber-Ochrona IoT/OT: symulowana fabryka mebli Wood-Tech CNC"
requires-python = "==3.13.*"
# Te same wersje co w lab/obrazy/sim/requirements.txt (obraz symulatorów): zmieniaj razem.
dependencies = [
    "paho-mqtt==2.2.0",
    "pymodbus==3.16.2",
    "pyroute2==0.9.7",
]

[tool.uv]
# Katalog główny to projekt, nie pakiet do instalacji.
package = false

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
# `make unit` (job unit w CI): testy jednostkowe symulatorów, bez Dockera.
# Testy na działającym labie są w tests/ (marker security, `make test-security`), poza testpaths.
# --strict-markers: literówka w markerze to błąd zbierania.
testpaths = ["lab/obrazy/sim/tests"]
pythonpath = ["lab/obrazy/sim"]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = [
    "security: test bezpieczeństwa na działającym labie (tests/security)",
]

[tool.ruff]
# `make lint` i job lint w CI; ruff w wersji z mise.toml.
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
