# CI (T01, wzorem secure-k8s-aiops): każdy PR i każdy push na main.
# Każdy job uruchamia cele make, które działają też lokalnie. Narzędzia instaluje jdx/mise-action z mise.toml
# (tylko te, których job potrzebuje); wersja mise to CI_MISE_VERSION poniżej (= min_version z mise.toml).
# Akcje przypięte po pełnym SHA commita z komentarzem wersji (lekcja z kompromitacji trivy-action,
# CVE-2026-33634); podbija je Dependabot.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # = min_version z mise.toml: zmieniaj razem.
  CI_MISE_VERSION: "2026.10.25"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ env.CI_MISE_VERSION }}
          install_args: ruff
      - run: make lint

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Tylko Python z mise.toml: uv nie pobiera własnego interpretera.
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ env.CI_MISE_VERSION }}
          install_args: python uv
      - run: make unit

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pełna historia: gitleaks skanuje wszystkie commity osiągalne z HEAD.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ env.CI_MISE_VERSION }}
          install_args: gitleaks
      - run: make gitleaks

  config:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ env.CI_MISE_VERSION }}
          install_args: trivy
      - id: trivy
        run: make trivy-config
      - if: ${{ !cancelled() && steps.trivy.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-config
          path: reports/trivy/
          overwrite: true
